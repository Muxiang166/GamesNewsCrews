[project]
name = "games-news-agent"
version = "0.1.0"
description = "LangGraph skeleton for a multi-agent games news intelligence pipeline."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
  "langchain-community>=0.4,<0.5",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
games-news-agent = "games_news_agent.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
